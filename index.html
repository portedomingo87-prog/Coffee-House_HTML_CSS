<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página web de una cafetería</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="encabezado">
        <section class="contenedor">
        <img src="img/img1.png" alt="Imagen de una tasa de cafeteria" class="img1">
        <h1>Cafetería Coffee House</h1>
        
        <nav class="nav1">
            <a href="#">Inicio</a>
            <a href="#">Menú</a>
            <a href="#">Nosotros</a>
            <a href="#">Contacto</a>
        </nav>
        </section>
    </header>

    <main class="main">
        <section class="hero">
        <section class="hero-content">
            <h1 class="titulo">El mejor café para comenzar tu día</h1>
            <p>Disfruta de un cafe delicioso en un ambiente acogedor y agradable para tu día</p>
            <button class="boton">Ver nuestro Menú</button>
        </section>
        <section class="hero-image">
            <img src="img/img2.png" alt="Imagen de una taza de cafe" class="img2">
        </section>
        </section>
    </main>

</body>
</html>
